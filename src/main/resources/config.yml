# Seconds a player must stand still (no moving, no damage) before a teleport happens
warmup-seconds: 3

# Seconds a player must wait between teleports (only starts after a successful teleport)
cooldown-seconds: 5

# Players must walk up and click a waystone to discover it before they can travel to it
require-discovery: true

# Allow teleporting between worlds / dimensions
cross-world: true

# Tamed pets that are following the player (not sitting) travel along.
# Leashed animals and ridden vehicles always come along.
bring-following-pets: true

# How close (in blocks) a following pet must be to come along
pet-range: 15

# Add the Waystone recipe to every player's recipe book when they join
unlock-recipe: true

# Floating hologram above each waystone. Heights are in blocks above the bottom (diamond) block.
# After editing, run /waystone admin reload.
hologram:
  name-y: 3.55      # the italic name line
  status-y: 3.30    # the Active / Inactive / Private line
  item-y: 4.2       # centre of the floating item (raise it if it overlaps the name)
  item-scale: 1.6   # size of the floating item (bigger number = bigger item)

# Bedrock players (joining through Geyser/Floodgate) can't see text/item displays,
# so they get invisible armor stands with name tags and a helmet item instead.
bedrock-holograms: true

# true = Bedrock players (Geyser/Floodgate) get a pop-up text box to name a waystone
# instead of the anvil. false = everyone uses the anvil. The form needs Floodgate installed;
# if it isn't available the anvil is used as a fallback.
bedrock-name-form: false
